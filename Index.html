<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Jarvis</title>
<style>
  :root { --bg:#f6f6f6; --card:#ffffff; --text:#151515; --dim:#7b7b80; --accent:#3e91ff; --soft:#e4efff; --line:#e8e8ea; --danger:#e5484d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --card:#1f1f21; --text:#f2f2f2; --dim:#9a9a9f; --accent:#5aa2ff; --soft:#16304f; --line:#2c2c2e; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,"Roboto","Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  button { font-family:inherit; cursor:pointer; }

  .top { display:flex; justify-content:space-between; align-items:flex-end; padding:34px 24px 10px; }
  .top h1 { margin:0; font-size:38px; font-weight:500; letter-spacing:-0.5px; }
  .top p { margin:4px 0 0; color:var(--dim); font-size:14px; }
  .iconbtn { width:44px; height:44px; border-radius:50%; border:none; background:var(--card); color:var(--text); font-size:20px; }

  main { flex:1; min-height:0; position:relative; }
  .tab { display:none; position:absolute; inset:0; flex-direction:column; }
  .tab.active { display:flex; }
  .scroll { flex:1; overflow-y:auto; padding:6px 16px 16px; }

  .card { background:var(--card); border-radius:26px; padding:16px 18px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:15px; font-weight:600; color:var(--dim); }

  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 16px 8px; scrollbar-width:none; flex:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; background:var(--card); color:var(--text); border:none; border-radius:999px; padding:10px 16px; font-size:14px; }
  .chip:active { background:var(--soft); }

  #chat { flex:1; overflow-y:auto; padding:6px 16px 10px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:84%; padding:11px 15px; border-radius:22px; line-height:1.45; font-size:15.5px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:8px; }
  .ai { align-self:flex-start; background:var(--card); border-bottom-left-radius:8px; }
  .sys { align-self:center; color:var(--dim); font-size:12.5px; text-align:center; }
  .actbtn { display:inline-block; margin-top:8px; background:var(--soft); color:var(--accent); text-decoration:none; padding:9px 14px; border-radius:999px; font-size:14px; font-weight:600; }

  .composer { flex:none; display:flex; gap:8px; align-items:center; padding:6px 16px 10px; }
  .composer.hide { display:none; }
  #input { flex:1; min-width:0; background:var(--card); border:none; color:var(--text); border-radius:999px; padding:14px 18px; font-size:15.5px; outline:none; }
  .circle { width:50px; height:50px; border-radius:50%; border:none; flex:none; font-size:20px; }
  #send { background:var(--card); color:var(--accent); }
  #mic { background:var(--accent); color:#fff; }
  #mic.listening { animation:pulse 1.1s infinite; background:var(--danger); }
  #mic.speaking { animation:pulse 2s infinite; background:#8b5cf6; }
  @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  #status { text-align:center; color:var(--dim); font-size:12px; min-height:16px; flex:none; }

  nav { flex:none; display:flex; gap:6px; margin:4px 16px calc(12px + env(safe-area-inset-bottom)); padding:6px; background:var(--card); border-radius:999px; }
  nav button { flex:1; border:none; background:none; color:var(--dim); padding:10px 4px; border-radius:999px; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button span { font-size:19px; }
  nav button.on { background:var(--soft); color:var(--accent); font-weight:600; }

  .field { width:100%; background:var(--bg); border:none; color:var(--text); border-radius:16px; padding:13px 15px; font-size:15px; margin-bottom:10px; outline:none; }
  .primary { background:var(--accent); color:#fff; border:none; border-radius:999px; padding:12px 20px; font-size:15px; font-weight:600; }
  .ghost { background:none; border:none; color:var(--accent); padding:10px 14px; font-size:15px; }
  .item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:none; }
  .item .t { flex:1; font-size:15.5px; }
  .item .d { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .item.done .t { text-decoration:line-through; color:var(--dim); }
  .x { background:none; border:none; color:var(--dim); font-size:18px; padding:4px 8px; }
  .empty { color:var(--dim); font-size:14px; padding:6px 0; }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }

  #toast { position:fixed; left:16px; right:16px; top:16px; background:var(--card); border-radius:26px; padding:16px 18px; box-shadow:0 8px 30px #0004; display:none; z-index:20; }
  #toast.show { display:block; }
  #toast b { display:block; color:var(--accent); font-size:12.5px; margin-bottom:4px; }
  #toast div { font-size:17px; margin-bottom:12px; }
  #toast .row { display:flex; gap:8px; justify-content:flex-end; }

  dialog { background:var(--bg); color:var(--text); border:none; border-radius:28px; width:min(94vw,440px); padding:20px; }
  dialog::backdrop { background:#0007; }
  dialog h2 { margin:0 0 14px; font-size:22px; font-weight:500; }
  label.l { display:block; font-size:12.5px; color:var(--dim); margin:10px 4px 5px; }
  .chk { display:flex; align-items:center; gap:10px; margin:12px 4px; font-size:15px; }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>Jarvis</h1>
    <p id="sub"></p>
  </div>
  <button class="iconbtn" id="btnSet" aria-label="Settings">&#9881;</button>
</div>

<main>
  <!-- Assistant -->
  <section class="tab active" id="tab-chat">
    <div class="chips" id="chips"></div>
    <div id="chat"></div>
    <div id="status">Tap the mic and speak</div>
    <div class="composer" id="composer">
      <input id="input" placeholder="Ask Jarvis..." autocomplete="off">
      <button class="circle" id="send" aria-label="Send">&#10148;</button>
      <button class="circle" id="mic" aria-label="Talk">&#127908;</button>
    </div>
  </section>

  <!-- Reminders -->
  <section class="tab" id="tab-rem">
    <div class="scroll">
      <div class="card">
        <h3>New reminder</h3>
        <input class="field" id="remText" placeholder="What should I remind you about?">
        <input class="field" id="remWhen" type="datetime-local">
        <button class="primary" id="remAdd">Add reminder</button>
      </div>
      <div class="card"><h3>Upcoming</h3><div id="remList"></div></div>
      <div class="card"><h3>Past</h3><div id="remPast"></div></div>
    </div>
  </section>

  <!-- Lists -->
  <section class="tab" id="tab-lists">
    <div class="scroll">
      <div class="card">
        <h3>Tasks</h3>
        <input class="field" id="taskText" placeholder="Add a task and press Enter">
        <div id="taskList"></div>
      </div>
      <div class="card">
        <h3>Notes (Jarvis remembers these)</h3>
        <input class="field" id="noteText" placeholder="Add a note and press Enter">
        <div id="noteList"></div>
      </div>
    </div>
  </section>
</main>

<nav id="nav">
  <button data-tab="chat" class="on"><span>&#128172;</span>Assistant</button>
  <button data-tab="rem"><span>&#9200;</span>Reminders</button>
  <button data-tab="lists"><span>&#9989;</span>Lists</button>
</nav>

<div id="toast">
  <b>REMINDER</b>
  <div id="toastText"></div>
  <div class="row">
    <button class="ghost" id="snooze">Snooze 10 min</button>
    <button class="primary" id="dismiss">Done</button>
  </div>
</div>

<dialog id="dlgSet">
  <h2>Settings</h2>
  <label class="l">Gemini API key (free: aistudio.google.com/apikey)</label>
  <input class="field" type="password" id="setKey" placeholder="Paste key here">
  <label class="l">Model</label>
  <input class="field" id="setModel">
  <label class="l">Your name</label>
  <input class="field" id="setName">
  <label class="l">Voice language</label>
  <input class="field" id="setLang" placeholder="en-IN">
  <div class="chk"><input type="checkbox" id="setSpeak"><span>Speak replies aloud</span></div>
  <div class="chk"><input type="checkbox" id="setConvo"><span>Conversation mode (listen again after each reply)</span></div>
  <div class="chk"><input type="checkbox" id="setAwake"><span>Keep screen on while Jarvis is open (helps reminders fire)</span></div>
  <div class="btns">
    <button class="ghost" id="clearChat">Clear chat</button>
    <button class="ghost" id="closeSet">Cancel</button>
    <button class="primary" id="saveSet">Save</button>
  </div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const LS = 'jarvis_oneui_v2';
  const defaults = { key:'', model:'gemini-2.5-flash', name:'Sivakarthikeyan', lang:'en-IN', speak:true, convo:false, awake:false, notes:[], tasks:[], reminders:[], history:[] };
  let S = Object.assign({}, defaults);
  try {
    // carry over data from Version 1 if it was used on the same site
    const old = JSON.parse(localStorage.getItem('jarvis_v1') || 'null');
    if (old) Object.assign(S, { key: old.key || '', model: old.model || S.model, name: old.name || S.name, notes: old.notes || [], tasks: (old.tasks || []).map(t => ({ text: t, done: false })) });
  } catch (e) {}
  try { Object.assign(S, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
  S.tasks = S.tasks.map(t => typeof t === 'string' ? { text: t, done: false } : t);
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fmt = ms => new Date(ms).toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

  const chat = $('chat'), statusEl = $('status'), mic = $('mic'), input = $('input');
  const setStatus = t => statusEl.textContent = t;

  /* ---------- Tabs ---------- */
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + b.dataset.tab));
    if (b.dataset.tab === 'rem') renderRem();
    if (b.dataset.tab === 'lists') renderLists();
  });
  const showTab = n => document.querySelector(`nav button[data-tab="${n}"]`).click();

  /* ---------- Chat ---------- */
  function add(role, text, store = true, btn = null) {
    const d = document.createElement('div');
    d.className = role === 'user' ? 'msg me' : role === 'sys' ? 'sys' : 'msg ai';
    d.textContent = text;
    if (btn) {
      d.appendChild(document.createElement('br'));
      const a = document.createElement('a');
      a.className = 'actbtn'; a.textContent = btn.label; a.href = btn.url;
      if (!btn.url.startsWith('intent:')) a.target = '_blank';
      d.appendChild(a);
    }
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    if (store && role !== 'sys') {
      S.history.push({ role: role === 'user' ? 'user' : 'model', text });
      S.history = S.history.slice(-30); save();
    }
  }

  /* ---------- Speech ---------- */
  const synth = window.speechSynthesis;
  function speak(text, then) {
    if (!S.speak || !synth) { then && then(); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_`#>~]/g, '').replace(/https?:\/\/\S+/g, 'link'));
    u.lang = S.lang || 'en-IN';
    u.onstart = () => { mic.className = 'circle speaking'; setStatus('Speaking...'); };
    u.onend = u.onerror = () => { mic.className = 'circle'; setStatus('Tap the mic and speak'); then && then(); };
    synth.speak(u);
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  function listen() {
    if (!SR) { add('sys', 'Voice input is not supported here. Use Chrome on Android.', false); return; }
    if (listening) { rec && rec.stop(); return; }
    if (synth) synth.cancel();
    rec = new SR(); rec.lang = S.lang || 'en-IN'; rec.interimResults = true; rec.continuous = false;
    let finalText = '';
    rec.onstart = () => { listening = true; mic.className = 'circle listening'; setStatus('Listening...'); };
    rec.onresult = e => {
      let t = '';
      for (let i = e.resultIndex; i < e.results.length; i++) { t += e.results[i][0].transcript; if (e.results[i].isFinal) finalText = t; }
      input.value = t;
    };
    rec.onerror = e => setStatus(e.error === 'not-allowed' ? 'Microphone permission denied' : 'Voice error: ' + e.error);
    rec.onend = () => {
      listening = false; mic.className = 'circle';
      if (finalText.trim()) { input.value = ''; handle(finalText.trim()); } else setStatus('Tap the mic and speak');
    };
    try { rec.start(); } catch (e) {}
  }

  /* ---------- Time parsing ---------- */
  function parseWhen(s) {
    const now = new Date(); let m, d = null, rest = s;
    if ((m = s.match(/\bin\s+(\d+|an?|half an)\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)\b/i))) {
      const n = /^an?$/i.test(m[1]) ? 1 : /half/i.test(m[1]) ? 0.5 : parseInt(m[1], 10);
      const u = m[2][0].toLowerCase();
      d = new Date(now.getTime() + n * (u === 's' ? 1000 : u === 'm' ? 60000 : 3600000));
      rest = rest.replace(m[0], ' ');
    } else {
      let h, min = 0, ap = null;
      if ((m = s.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m\.?(?![a-z])/i))) { h = +m[1]; min = +(m[2] || 0); ap = m[3].toLowerCase(); }
      else if ((m = s.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\b/i))) { h = +m[1]; min = +(m[2] || 0); }
      else if ((m = s.match(/\b(\d{1,2}):(\d{2})\b/))) { h = +m[1]; min = +m[2]; }
      if (m) {
        rest = rest.replace(m[0], ' ');
        const tomorrow = /\btomorrow\b/i.test(s), tonight = /\btonight\b/i.test(s);
        rest = rest.replace(/\b(tomorrow|today|tonight)\b/ig, ' ');
        if (ap) h = (h % 12) + (ap === 'p' ? 12 : 0);
        else if (tonight && h < 12) h += 12;
        if (h > 23 || min > 59) return { date: null, rest: s };
        d = new Date(now); d.setHours(h, min, 0, 0);
        if (tomorrow) d.setDate(d.getDate() + 1);
        else if (d <= now) {
          if (!ap && h < 12) { const d2 = new Date(d); d2.setHours(h + 12); if (d2 > now) d = d2; else d.setDate(d.getDate() + 1); }
          else d.setDate(d.getDate() + 1);
        }
      }
    }
    rest = rest.replace(/\s+/g, ' ').replace(/^[\s,]*(to|about|that)\s+/i, '').replace(/\s+(to|about)\s*$/i, '').replace(/[\s,]+$/, '').trim();
    return { date: d, rest };
  }

  /* ---------- Reminders ---------- */
  function addReminder(text, at) {
    S.reminders.push({ id: uid(), text, at, done: false, snoozed: 0 });
    save(); renderRem();
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
  }
  function renderRem() {
    const up = S.reminders.filter(r => !r.done).sort((a, b) => a.at - b.at);
    const past = S.reminders.filter(r => r.done).sort((a, b) => b.at - a.at).slice(0, 15);
    const row = r => `<div class="item"><div class="t">${esc(r.text)}<div class="d">${fmt(r.at)}</div></div><button class="x" data-del="${r.id}">&#10005;</button></div>`;
    $('remList').innerHTML = up.length ? up.map(row).join('') : '<div class="empty">Nothing scheduled.</div>';
    $('remPast').innerHTML = past.length ? past.map(row).join('') : '<div class="empty">No past reminders.</div>';
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.reminders = S.reminders.filter(r => r.id !== b.dataset.del); save(); renderRem(); });
  }
  $('remAdd').onclick = () => {
    const t = $('remText').value.trim(), w = $('remWhen').value;
    if (!t || !w) return;
    addReminder(t, new Date(w).getTime());
    $('remText').value = ''; $('remWhen').value = '';
  };

  let current = null, ctx = null;
  function beep() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach(t => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.2, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
      });
    } catch (e) {}
  }
  function fire(r) {
    current = r;
    $('toastText').textContent = r.text; $('toast').classList.add('show');
    add('ai', 'Reminder: ' + r.text, true);
    beep(); try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Jarvis reminder', { body: r.text }); } catch (e) {}
    speak('Reminder. ' + r.text);
  }
  function checkReminders() {
    const now = Date.now();
    const due = S.reminders.filter(r => !r.done && r.at <= now).sort((a, b) => a.at - b.at)[0];
    if (due && (!current || current.done)) { due.done = true; save(); fire(due); renderRem(); }
  }
  $('dismiss').onclick = () => { $('toast').classList.remove('show'); current = null; };
  $('snooze').onclick = () => {
    if (current) { addReminder(current.text, Date.now() + 10 * 60000); }
    $('toast').classList.remove('show'); current = null;
  };
  setInterval(checkReminders, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkReminders(); wake(); } });

  /* ---------- Lists ---------- */
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function renderLists() {
    $('taskList').innerHTML = S.tasks.length ? S.tasks.map((t, i) => `<div class="item ${t.done ? 'done' : ''}"><input type="checkbox" data-tk="${i}" ${t.done ? 'checked' : ''}><div class="t">${esc(t.text)}</div><button class="x" data-td="${i}">&#10005;</button></div>`).join('') : '<div class="empty">No tasks.</div>';
    $('noteList').innerHTML = S.notes.length ? S.notes.map((n, i) => `<div class="item"><div class="t">${esc(n)}</div><button class="x" data-nd="${i}">&#10005;</button></div>`).join('') : '<div class="empty">No notes.</div>';
    document.querySelectorAll('[data-tk]').forEach(c => c.onchange = () => { S.tasks[+c.dataset.tk].done = c.checked; save(); renderLists(); });
    document.querySelectorAll('[data-td]').forEach(b => b.onclick = () => { S.tasks.splice(+b.dataset.td, 1); save(); renderLists(); });
    document.querySelectorAll('[data-nd]').forEach(b => b.onclick = () => { S.notes.splice(+b.dataset.nd, 1); save(); renderLists(); });
  }
  $('taskText').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) { S.tasks.push({ text: e.target.value.trim(), done: false }); e.target.value = ''; save(); renderLists(); } });
  $('noteText').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) { S.notes.push(e.target.value.trim()); e.target.value = ''; save(); renderLists(); } });

  /* ---------- Weather (Open-Meteo, free, no key) ---------- */
  const WX = { 0:'clear sky',1:'mostly clear',2:'partly cloudy',3:'overcast',45:'foggy',48:'foggy',51:'light drizzle',53:'drizzle',55:'heavy drizzle',61:'light rain',63:'rain',65:'heavy rain',71:'light snow',73:'snow',75:'heavy snow',80:'rain showers',81:'rain showers',82:'heavy showers',95:'thunderstorm',96:'thunderstorm with hail',99:'thunderstorm with hail' };
  function weather() {
    return new Promise(res => {
      if (!navigator.geolocation) return res('Location is not available on this device.');
      navigator.geolocation.getCurrentPosition(async p => {
        try {
          const u = `https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
          const j = await (await fetch(u)).json();
          const c = j.current, d = j.daily;
          res(`It is ${Math.round(c.temperature_2m)} degrees and ${WX[c.weather_code] || 'fair'}, feels like ${Math.round(c.apparent_temperature)}. Today's range is ${Math.round(d.temperature_2m_min[0])} to ${Math.round(d.temperature_2m_max[0])}, with a ${d.precipitation_probability_max[0]} percent chance of rain.`);
        } catch (e) { res('I could not fetch the weather right now.'); }
      }, () => res('I need location permission to check the weather.'), { timeout: 10000 });
    });
  }

  /* ---------- Local commands ---------- */
  const intent = (action, extras) => `intent:#Intent;action=${action};${extras};end`;
  const UNIT = { s: 1, m: 60, h: 3600 };
  async function local(raw) {
    const t = raw.toLowerCase().trim().replace(/[.!?]+$/, '');
    let m;

    // Reminders
    if ((m = raw.match(/^(?:remind me|set (?:a )?reminder|add (?:a )?reminder)\s*(.*)/i))) {
      const p = parseWhen(m[1]);
      if (!p.date) return { text: 'When should I remind you? Try: remind me to call home at 6 pm.' };
      if (!p.rest) return { text: 'What should I remind you about?' };
      addReminder(p.rest, p.date.getTime());
      return { text: `Done. I will remind you to ${p.rest} on ${fmt(p.date.getTime())}. Keep Jarvis open for this to fire. For a guaranteed alert, also say set alarm.` };
    }
    if (/^(show|list|what are|read)( me)?( my)? reminders/.test(t) || t === 'my reminders') {
      const up = S.reminders.filter(r => !r.done).sort((a, b) => a.at - b.at);
      showTab('rem');
      return { text: up.length ? 'Your reminders: ' + up.map(r => r.text + ' at ' + fmt(r.at)).join('. ') : 'You have no reminders.' };
    }
    if (/^clear (all )?reminders/.test(t)) { S.reminders = []; save(); renderRem(); return { text: 'All reminders cleared.' }; }

    // Alarm and timer through the phone's Clock app
    if (/\balarm\b/.test(t) && /^(set|create|add|wake|make)/.test(t)) {
      const p = parseWhen(raw);
      if (!p.date) return { text: 'What time? Try: set alarm for 6:30 am.' };
      const hh = p.date.getHours(), mm = p.date.getMinutes();
      const label = p.rest.replace(/\b(set|create|add|make|an?|alarm|for|wake me up|wake me)\b/ig, ' ').replace(/\s+/g, ' ').trim() || 'Jarvis';
      const url = intent('android.intent.action.SET_ALARM', `i.android.intent.extra.alarm.HOUR=${hh};i.android.intent.extra.alarm.MINUTES=${mm};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(label)};B.android.intent.extra.alarm.SKIP_UI=true`);
      const when = p.date.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      return { text: `Alarm for ${when}. Tap the button to set it in your Clock app.`, btn: { label: 'Set alarm ' + when, url } };
    }
    if ((m = t.match(/\btimer\b.*?(\d+)\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)/)) && /^(set|start|create|timer)/.test(t)) {
      const secs = +m[1] * UNIT[m[2][0]];
      const url = intent('android.intent.action.SET_TIMER', `i.android.intent.extra.alarm.LENGTH=${secs};S.android.intent.extra.alarm.MESSAGE=Jarvis;B.android.intent.extra.alarm.SKIP_UI=true`);
      return { text: `Timer for ${m[1]} ${m[2]}. Tap the button to start it.`, btn: { label: 'Start timer', url } };
    }

    // Notes and tasks
    if ((m = raw.match(/^(?:remember|note|make a note)(?: that)?\s+(.+)/i))) { S.notes.push(m[1]); save(); renderLists(); return { text: 'Noted. I will remember that.' }; }
    if ((m = raw.match(/^(?:add task|add a task|new task|task)\s+(.+)/i))) { S.tasks.push({ text: m[1], done: false }); save(); renderLists(); return { text: 'Task added: ' + m[1] }; }
    if (/^(show|list|what are|read)( me)?( my)? tasks/.test(t) || t === 'my tasks') {
      const open = S.tasks.filter(x => !x.done);
      return { text: open.length ? 'Your tasks: ' + open.map((x, i) => (i + 1) + '. ' + x.text).join('. ') : 'You have no pending tasks.' };
    }
    if (/^(show|list|what are|read)( me)?( my)? notes/.test(t) || t === 'my notes') {
      return { text: S.notes.length ? 'Your notes: ' + S.notes.map((x, i) => (i + 1) + '. ' + x).join('. ') : 'You have no notes.' };
    }
    if ((m = t.match(/^(?:done|complete|finish|finished|tick) task (\d+)/))) {
      const open = S.tasks.filter(x => !x.done), x = open[+m[1] - 1];
      if (x) { x.done = true; save(); renderLists(); return { text: 'Marked done: ' + x.text }; }
      return { text: 'There is no task with that number.' };
    }
    if (/^clear (all )?tasks/.test(t)) { S.tasks = []; save(); renderLists(); return { text: 'All tasks cleared.' }; }
    if (/^clear (all )?notes/.test(t)) { S.notes = []; save(); renderLists(); return { text: 'All notes cleared.' }; }

    // Info
    if (/^(what('s| is) the )?time( now)?$/.test(t) || t === 'what time is it') return { text: 'It is ' + new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) + '.' };
    if (/^(what('s| is) )?(the )?(today'?s )?date( today)?$/.test(t) || t === 'what day is it') return { text: 'Today is ' + new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '.' };
    if (/\bweather\b/.test(t) && !/\b(in|at|for)\s+[a-z]/.test(t.replace(/weather (today|now|outside)/, ''))) return { text: await weather() };
    if ((m = t.match(/^(?:calculate|calc|compute|what is|what's)\s+([\d\s+\-*/().%x÷^]+)$/)) && /\d/.test(m[1]) && /[+\-*/x÷^%]/.test(m[1])) {
      try {
        const expr = m[1].replace(/x/g, '*').replace(/÷/g, '/').replace(/\^/g, '**');
        const v = Function('"use strict";return (' + expr + ')')();
        if (isFinite(v)) return { text: m[1].trim() + ' equals ' + Math.round(v * 1e6) / 1e6 + '.' };
      } catch (e) {}
    }

    // Apps and actions
    const apps = { youtube: 'https://m.youtube.com', whatsapp: 'https://wa.me/', maps: 'https://maps.google.com', gmail: 'https://mail.google.com', instagram: 'https://instagram.com', spotify: 'https://open.spotify.com', camera: 'intent:#Intent;action=android.media.action.STILL_IMAGE_CAMERA;end', calculator: 'https://www.google.com/search?q=calculator', clock: 'intent:#Intent;action=android.intent.action.SHOW_ALARMS;end' };
    if ((m = t.match(/^open (\w+)$/)) && apps[m[1]]) return { text: 'Opening ' + m[1] + '. Tap the button.', btn: { label: 'Open ' + m[1], url: apps[m[1]] } };
    if ((m = raw.match(/^(?:search|google)(?: for)?\s+(.+)/i))) return { text: 'Searching for ' + m[1] + '.', btn: { label: 'Open results', url: 'https://www.google.com/search?q=' + encodeURIComponent(m[1]) } };
    if ((m = raw.match(/^play\s+(.+?)(?: on youtube)?$/i))) return { text: 'Here is ' + m[1] + ' on YouTube.', btn: { label: 'Open YouTube', url: 'https://m.youtube.com/results?search_query=' + encodeURIComponent(m[1]) } };
    if ((m = raw.match(/^(?:navigate to|directions to|take me to|route to)\s+(.+)/i))) return { text: 'Directions to ' + m[1] + '.', btn: { label: 'Open Maps', url: 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(m[1]) } };
    if ((m = t.match(/^call\s+([\d\s+]{6,})$/))) { const n = m[1].replace(/\s/g, ''); return { text: 'Calling ' + n + '. Tap to dial.', btn: { label: 'Call ' + n, url: 'tel:' + n } }; }
    if ((m = raw.match(/^(?:whatsapp|message|text)\s+(\+?\d[\d\s]{7,})\s+(.+)/i))) { const n = m[1].replace(/\s/g, ''); return { text: 'Message ready.', btn: { label: 'Send on WhatsApp', url: 'https://wa.me/' + n.replace('+', '') + '?text=' + encodeURIComponent(m[2]) } }; }
    return null;
  }

  /* ---------- Gemini ---------- */
  function systemPrompt() {
    const now = new Date().toLocaleString('en-IN', { dateStyle: 'full', timeStyle: 'short' });
    const up = S.reminders.filter(r => !r.done).sort((a, b) => a.at - b.at).map(r => r.text + ' (' + fmt(r.at) + ')');
    return `You are JARVIS, a personal voice assistant for ${S.name || 'the user'} only. Be warm, sharp and concise: replies are spoken aloud, so keep them under 3 short sentences unless asked for detail. No markdown, no emojis, no bullet lists. Current date and time: ${now} (India).
Notes: ${S.notes.join(' | ') || 'none'}.
Pending tasks: ${S.tasks.filter(t => !t.done).map(t => t.text).join(' | ') || 'none'}.
Upcoming reminders: ${up.join(' | ') || 'none'}.
Use these only when relevant. If asked to set a reminder, alarm or timer, tell the user to say it like "remind me to X at 6 pm", "set alarm for 6:30 am" or "set timer for 10 minutes".`;
  }
  async function askGemini() {
    if (!S.key) throw new Error('No API key yet. Open Settings (top right) and paste your free Gemini key.');
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.key },
      body: JSON.stringify({ system_instruction: { parts: [{ text: systemPrompt() }] }, contents: S.history.map(h => ({ role: h.role, parts: [{ text: h.text }] })) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || 'Request failed (' + res.status + ')');
    const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
    const text = parts ? parts.map(p => p.text || '').join('').trim() : '';
    if (!text) throw new Error('Empty reply (possibly blocked).');
    return text;
  }

  /* ---------- Main handler ---------- */
  let busy = false;
  async function handle(text) {
    if (busy) return;
    busy = true;
    showTab('chat');
    add('user', text);
    const after = () => { busy = false; if (S.convo) setTimeout(listen, 300); };
    let l = null;
    try { l = await local(text); } catch (e) { l = null; }
    if (l) { add('ai', l.text, true, l.btn); speak(l.text, after); return; }
    setStatus('Thinking...');
    try { const r = await askGemini(); add('ai', r); speak(r, after); }
    catch (err) { add('sys', 'Error: ' + err.message, false); setStatus('Tap the mic and speak'); busy = false; }
  }

  /* ---------- Quick chips ---------- */
  const CHIPS = [
    ['What time is it', 'What time is it'], ['Weather', 'weather'], ['My reminders', 'show my reminders'], ['My tasks', 'show my tasks'],
    ['Timer 5 min', 'set timer for 5 minutes'], ['Plan my day', 'Plan my day using my tasks and reminders'],
    ['Tell a joke', 'Tell me a short joke'], ['Open YouTube', 'open youtube'], ['Open Maps', 'open maps']
  ];
  $('chips').innerHTML = CHIPS.map((c, i) => `<button class="chip" data-c="${i}">${c[0]}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => handle(CHIPS[+b.dataset.c][1]));

  /* ---------- Controls ---------- */
  mic.onclick = listen;
  $('send').onclick = () => { const v = input.value.trim(); if (v) { input.value = ''; handle(v); } };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });

  const dlg = $('dlgSet');
  $('btnSet').onclick = () => {
    $('setKey').value = S.key; $('setModel').value = S.model; $('setName').value = S.name; $('setLang').value = S.lang;
    $('setSpeak').checked = S.speak; $('setConvo').checked = S.convo; $('setAwake').checked = S.awake;
    dlg.showModal();
  };
  $('closeSet').onclick = () => dlg.close();
  $('saveSet').onclick = () => {
    S.key = $('setKey').value.trim(); S.model = $('setModel').value.trim() || defaults.model;
    S.name = $('setName').value.trim(); S.lang = $('setLang').value.trim() || 'en-IN';
    S.speak = $('setSpeak').checked; S.convo = $('setConvo').checked; S.awake = $('setAwake').checked;
    save(); dlg.close(); wake();
  };
  $('clearChat').onclick = () => { S.history = []; save(); chat.innerHTML = ''; dlg.close(); add('sys', 'Chat cleared.', false); };

  let lock = null;
  async function wake() {
    try {
      if (S.awake && 'wakeLock' in navigator && !document.hidden) lock = await navigator.wakeLock.request('screen');
      else if (!S.awake && lock) { lock.release(); lock = null; }
    } catch (e) {}
  }

  /* ---------- Boot ---------- */
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  $('sub').textContent = `${greet}, ${S.name || 'sir'}`;
  S.history.forEach(h => add(h.role === 'user' ? 'user' : 'ai', h.text, false));
  add('sys', S.key ? 'Online and ready.' : 'Open Settings (top right) and paste your free Gemini API key to start chatting. Reminders, alarms and quick commands work without it.', false);
  renderRem(); renderLists(); wake(); checkReminders();
})();
</script>
</body>
</html>
